<!DOCTYPE html>

<head>

<title>Beauty Clinic — App do Paciente</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  .header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #16213e; padding: 12px 16px; display: flex; gap: 6px; overflow-x: auto; justify-content: center; border-bottom: 1px solid #0f3460; }
  .header button { padding: 8px 14px; border-radius: 20px; border: 1px solid #0f3460; background: transparent; color: #a0a0b8; cursor: pointer; font-size: 12px; font-weight: 500; white-space: nowrap; transition: all 0.2s; }
  .header button:hover { background: #0f3460; color: white; }
  .header button.active { background: #F43F5E; color: white; border-color: #F43F5E; }
  .phone-frame { margin-top: 60px; width: 375px; height: 812px; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 8px solid #333; position: relative; background: white; }
  .phone-frame iframe { width: 391px; height: 828px; border: none; position: absolute; top: -8px; left: -8px; display: none; }
  .phone-frame iframe.active { display: block; }
  .info { color: #a0a0b8; margin-top: 16px; font-size: 13px; text-align: center; }
</style>
</head>

<div class="header">  <button class=" active" onclick="show(0)"> Home</button>

  <button class="" onclick="show(5)"> Perfil</button>
</div>

  <iframe id="page1" class="" src="file:///C:/Users/Marcos/Documents/Default Project/squads/beauty-clinic/output/2026-08-02-010840/v2/design/02-checkin.html"></iframe>
  <iframe id="page2" class="" src="file:///C:/Users/Marcos/Documents/Default Project/squads/beauty-clinic/output/2026-08-02-010840/v2/design/03-progresso.html"></iframe>
  <iframe id="page3" class="" src="file:///C:/Users/Marcos/Documents/Default Project/squads/beauty-clinic/output/2026-08-02-010840/v2/design/04-conquistas.html"></iframe>

<p class="info">App do Paciente — Beauty Clinic — Mobile 375×812</p>
<script>
function show(n) {
  document.querySelectorAll('iframe').forEach((f,i) => f.classList.toggle('active', i===n));
  document.querySelectorAll('.header button').forEach((b,i) => b.classList.toggle('active', i===n));
}
</script>
