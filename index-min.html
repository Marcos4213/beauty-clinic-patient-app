<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>Beauty Clinic — App do Paciente</title> <script src="https://cdn.tailwindcss.com"></script> <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"> <script> tailwind.config = {theme:{extend:{fontFamily:{display:['"DM Serif Display"', 'Georgia', 'serif'], body:['"DM Sans"', 'system-ui', 'sans-serif'],}, colors:{warm:{bg:'#FFF8F5', cream:'#FFF5EB'}, rose:{50:'#FFF1F2',100:'#FFE4E6',200:'#FECDD3',300:'#FDA4AF',400:'#FB7185',500:'#F43F5E',600:'#E11D48'}, sage:{50:'#F0F5F0',100:'#DCE5DC',200:'#B8CCB8',400:'#6B9E6B',500:'#4A7C4A',600:'#3A6B3A'}, gold:{50:'#FFFBEB',100:'#FEF3C7',200:'#FDE68A',400:'#FBBF24',500:'#F59E0B',600:'#D97706'}, txt:{primary:'#2D2A26',body:'#5C5650',muted:'#8A847C'},}}}} </script> <style> body{font-family:'DM Sans',system-ui,sans-serif;background:#FFF8F5;-webkit-tap-highlight-color:transparent} .font-display{font-family:'DM Serif Display',Georgia,serif} @keyframes pulse-fire{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}} .animate-fire{animation:pulse-fire 2s ease-in-out infinite} @keyframes slide-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}} .animate-slide-up{animation:slide-up .4s ease-out} @keyframes slide-in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}} .animate-slide-in{animation:slide-in .3s ease-out} .page{display:none}.page.active{display:block} .scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none} .nav-item.active{color:#F43F5E}.nav-item.active svg{stroke:#F43F5E} .bottom-nav{padding-bottom:env(safe-area-inset-bottom,8px)} .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;justify-content:center} .modal-overlay.show{display:flex} .modal-content{background:#FFF8F5;border-radius:24px 24px 0 0;width:100%;max-width:375px;max-height:85vh;overflow-y:auto;padding:24px 20px 40px} .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2D2A26;color:white;padding:12px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none} .toast.show{opacity:1} </style> </head> <body class="bg-warm-bg min-h-screen flex items-center justify-center p-4"> <div id="app" class="mx-auto max-w-[375px] min-h-[812px] bg-warm-bg relative overflow-hidden" style="box-shadow:0 0 0 1px rgba(0,0,0,.08),0 20px 60px rgba(0,0,0,.12);border-radius:40px"> <div id="pages-container" class="pb-20"> <div id="page-home" class="page active"> <div class="px-5 pt-3 pb-4"> <div class="pt-3 pb-2"> <p class="text-sm text-txt-muted">Bom dia</p> <h1 class="font-display text-[1.75rem] leading-tight text-txt-primary mt-0.5">Ana, boa energia!</h1> </div> </div> </div> </div> <script> function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const page=document.getElementById('page-'+id);if(page){page.classList.add('active');page.scrollTop=0;document.getElementById('pages-container').scrollTop=0}document.querySelectorAll('.nav-item').forEach(n=>{n.classList.toggle('active',n.dataset.page===id);if(n.dataset.page===id){n.querySelector('svg').style.stroke='#F43F5E';n.querySelector('span').style.color='#F43F5E'}else{n.querySelector('svg').style.stroke='';n.querySelector('span').style.color=''}})} function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)} </script> </body> </html>
