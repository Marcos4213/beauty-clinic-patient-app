<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beauty Clinic — Dra. Rachel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2C4C; --sage:#2E8B6E; --gold:#C9A86C;
  --bg:#F7F5F2; --surface:#FFFFFF; --text:#1A1A1A; --text2:#5C5C5C; --text3:#8A8A8A;
  --border:#E8E4DF; --success:#2E8B6E; --warning:#D4A017; --error:#C45C5C;
  --navy-soft:#EAF0F6; --sage-soft:#E7F1ED; --gold-soft:#F6F0E6;
  --shadow:0 6px 24px rgba(15,44,76,.07); --shadow-lg:0 12px 40px rgba(15,44,76,.10);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);padding-bottom:84px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.screen{display:none;animation:fade .25s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.section{padding:16px 16px 8px}
.muted{color:var(--text2)} .tertiary{color:var(--text3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:15px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--navy);color:#fff;box-shadow:0 8px 20px rgba(15,44,76,.22)}
.btn-sage{background:var(--sage);color:#fff}
.btn-ghost{background:var(--navy-soft);color:var(--navy)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-sm{padding:11px 14px;font-size:14px;border-radius:12px;width:auto}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--navy-soft);color:var(--navy);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.chip-sage{background:var(--sage-soft);color:var(--sage)}
.chip-gold{background:var(--gold-soft);color:#9A7B3E}
.badge{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* Header */
.topbar{position:sticky;top:0;z-index:30;background:rgba(247,245,242,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--sage));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;box-shadow:0 4px 12px rgba(15,44,76,.18)}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;cursor:pointer}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;position:relative;flex-shrink:0}
/* Hero / Action card */
.hero{background:linear-gradient(135deg,var(--navy),#16406E);color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,108,.32),transparent 70%)}
.hero h2{font-size:22px;line-height:1.2}
.hero .sub{opacity:.85;font-size:14px;margin-top:6px}
.hero .meta{display:flex;gap:14px;margin-top:14px;font-size:13px;opacity:.9}
.hero .meta b{font-weight:700}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--sage) calc(var(--p)*1%),#E2E8EE 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring span{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .12s,box-shadow .2s}
.qcard:active{transform:scale(.97)}
.qcard .qi{width:38px;height:38px;border-radius:11px;background:var(--navy-soft);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.qcard .ql{font-size:13px;font-weight:600}
.streak-row{display:flex;align-items:center;justify-content:space-between}
.stat{display:flex;align-items:center;gap:10px}
.stat .num{font-size:26px;font-weight:800;color:var(--navy);line-height:1}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:.15s}
.check.done{background:var(--sage);border-color:var(--sage);color:#fff}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-grid img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;cursor:pointer;border:1px solid var(--border)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;padding:6px 0 4px;border-radius:10px;transition:.15s}
.nav button.active{color:var(--navy)}
.nav button.active svg{stroke:var(--navy)}
.nav .center{margin-top:-28px;flex:none;width:72px}
.nav .center .fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--sage));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(15,44,76,.3)}
.nav .center span{margin-top:2px}
/* Overlay / drawer / modal */
.overlay{position:fixed;inset:0;background:rgba(15,44,76,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:90vh;background:var(--bg);border-radius:26px 26px 0 0;z-index:61;transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:8px 0 28px}
.sheet.show{transform:translate(-50%,0)}
.sheet-h{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--border)}
.modal{position:fixed;inset:0;z-index:62;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,44,76,.45)}
.modal.show{display:flex}
.modal .box{background:var(--surface);border-radius:22px;width:100%;max-width:420px;padding:24px;box-shadow:var(--shadow-lg);max-height:88vh;overflow-y:auto}
.close{width:34px;height:34px;border-radius:50%;background:var(--navy-soft);color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--navy);color:#fff;padding:13px 22px;border-radius:14px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:.3s;box-shadow:var(--shadow-lg);pointer-events:none;text-align:center;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.product{display:flex;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.product img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0}
.cart-pill{position:fixed;right:16px;bottom:96px;z-index:45;background:var(--navy);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;display:none;align-items:center;gap:8px;box-shadow:var(--shadow-lg);cursor:pointer}
.appt{display:flex;gap:14px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px}
.appt .date{width:56px;height:56px;border-radius:14px;background:var(--navy-soft);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;line-height:1}
.appt .date b{font-size:20px}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty svg{width:48px;height:48px;color:var(--border);margin-bottom:12px}
.seg{display:flex;gap:6px;background:var(--navy-soft);border-radius:12px;padding:4px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:13px;color:var(--text2);cursor:pointer}
.seg button.active{background:var(--surface);color:var(--navy);box-shadow:var(--shadow)}
.before-after{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.before-after .ph{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);aspect-ratio:1}
.before-after .ph img{width:100%;height:100%;object-fit:cover}
.before-after .ph span{position:absolute;bottom:8px;left:8px;background:rgba(15,44,76,.7);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item::before{content:"";position:absolute;left:-19px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--sage);border:2px solid var(--bg)}
.tl-item.muted::before{background:var(--text3)}
.fab-wa{position:fixed;right:16px;bottom:100px;z-index:44;width:54px;height:54px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(37,211,102,.4);transition:transform .15s}
.fab-wa:active{transform:scale(.92)}
.fab-wa svg{width:30px;height:30px;fill:#fff}
.progressbar{height:8px;border-radius:999px;background:var(--border);overflow:hidden}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--navy));border-radius:999px}
@media(max-width:380px){.grid2{gap:10px}.section{padding:12px 12px 8px}}
</style>
</head>

<script>

/* ============ RENDER: TOPBAR + NAV ============ */
function renderTopbar(){
  const map={
    inicio:`<div class="logo">RC</div><div style="flex:1;min-width:0"><p style="font-weight:700;font-size:15px">${greeting()}, ${S.nome}</p><p class="tertiary" style="font-size:12px">Acompanhamento da Dra. Rachel</p></div><div class="icon-btn" onclick="openNotificacoes()">${svgP('bell')}</div><div class="avatar" onclick="go('perfil')">${S.nome[0]}</div>`,
    tratamento:`<div class="logo">RC</div><div style="flex:1;min-width:0"><p style="font-weight:700">Meu Tratamento</p><p class="tertiary" style="font-size:12px">Protocolo personalizado pela Dra. Rachel</p></div>`,
    progresso:`<div class="logo">RC</div><div style="flex:1"><p style="font-weight:700">Progresso</p><p class="tertiary" style="font-size:12px">Sua evolução ao longo do tempo</p></div>`,
    agenda:`<div class="logo">RC</div><div style="flex:1"><p style="font-weight:700">Agenda</p><p class="tertiary" style="font-size:12px">Seus retornos a cada 15 dias</p></div>`,
    perfil:`<div class="logo">RC</div><div style="flex:1"><p style="font-weight:700">Perfil</p><p class="tertiary" style="font-size:12px">${S.nome} · ${S.idade} anos</p></div>`
  };
  $('#topbar').innerHTML = map[state.page] || map.inicio;
}
function renderNav(){
  const nav=[['inicio','Início',svgP('home')],['tratamento','Tratamento',svgP('trat')],['checkin','',svgP('check')],['progresso','Progresso',svgP('prog')],['agenda','Agenda',svgP('agenda')],['perfil','Perfil',svgP('perfil')]];
  let h='';
  nav.forEach(([p,label,ic])=>{
    if(p==='checkin'){ h+=`<button class="center" onclick="openCheckin()"><div class="fab">${svgP('check')}</div><span style="font-size:10px;color:var(--text3);font-weight:600">Check-in</span></button>`; }
    else { h+=`<button class="${state.page===p?'active':''}" onclick="go('${p}')">${ic}<span>${label}</span></button>`; }
  });
  $('#bottomnav').innerHTML=h;
}

/* ============ SCREEN LOGIC ============ */
const state={page:'inicio'};
function go(p){ state.page=p; document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $('#scr-'+p).classList.add('active'); renderTopbar(); renderNav(); window.scrollTo(0,0); renderScreen(p); }
const FRASES=['Você está no caminho certo.','Cada dia de constância conta.','Parceria com a Dra. Rachel: você não está sozinho nessa.','Progresso é resultado de pequenas ações diárias.','Sua regularidade impressiona. Continue.'];
function frase(){ const i=new Date().getDate()%FRASES.length; return FRASES[i]; }

function renderScreen(p){
  if(p==='inicio') renderInicio();
  if(p==='tratamento') renderTratamento();
  if(p==='progresso') renderProgresso();
  if(p==='agenda') renderAgenda();
  if(p==='perfil') renderPerfil();
}

/* ---- INÍCIO ---- */

  const feitoHoje = S.concluidosHoje.includes(hojeStr());
  const hero = feitoHoje

    : `<div class="hero"><p style="font-size:12px;font-weight:700;opacity:.8;letter-spacing:.05em;text-transform:uppercase">Sua tarefa de hoje</p><h2 style="margin-top:6px">Check-in do tratamento</h2><div class="sub">Foto de progresso + aplicação dos produtos do protocolo.</div><div class="meta"><span>⏱ ~2 min</span><span>✦ +50 pontos</span></div><button class="btn" style="background:#fff;color:var(--navy);margin-top:16px" onclick="openCheckin()">Fazer Check-in</button></div>`;
  $('#hero-acao').innerHTML=hero;

  const c=compliance();
  $('#card-progresso').innerHTML=`<div class="streak-row"><div><p style="font-size:13px;font-weight:600;color:var(--text2)">Semana ${Math.ceil(S.checkins.length/7)+4} · Geral</p><p style="font-weight:800;font-size:17px;margin-top:2px">Compliance de adesão</p></div><div class="ring" style="--p:${c}"><span>${c}%</span></div></div><div class="progressbar" style="margin-top:12px"><i style="width:${c}%"></i></div><p class="muted" style="font-size:13px;margin-top:12px">${frase()} Resultados costumam aparecer entre a 8ª e a 12ª semana.</p>`;

  const acessos=[
    {i:'trat',l:'Protocolo de hoje',f:"go('tratamento')"},
    {i:'photo',l:'Galeria de fotos',f:"go('progresso')"},
    {i:'store',l:'Loja',f:"openLoja()"},

  ];

  const dica=DICAS[new Date().getDate()%DICAS.length];
  $('#card-dica').innerHTML=`<p style="font-size:12px;font-weight:700;color:#9A7B3E;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px">Dica do dia</p><p style="font-size:14px;color:#5C4A2E">${dica}</p>`;
}

/* ---- TRATAMENTO ---- */
function renderTratamento(){
  const c=compliance();
  let html=`<div class="card" style="background:linear-gradient(135deg,var(--navy),#16406E);color:#fff;border:none">
    <p style="font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.05em">Compliance do mês</p>
    <div style="display:flex;align-items:center;gap:16px;margin-top:8px"><div class="ring" style="--p:${c}"><span style="color:var(--navy)">${c}%</span></div>
    <div><p style="font-size:22px;font-weight:800">${S.streak} dias</p><p style="opacity:.85;font-size:13px">de sequência de cuidado</p></div></div></div>`;

  html+=`<div class="card" style="margin-top:14px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><h3 style="font-size:16px">Protocolo de hoje</h3><span class="chip-sage">${PROTOCOLO_HOJE.filter(p=>S.concluidosHoje.includes(hojeStr()+'_'+p.id)).length}/${PROTOCOLO_HOJE.length}</span></div>`;
  html+=PROTOCOLO_HOJE.map(p=>{
    const done=S.concluidosHoje.includes(hojeStr()+'_'+p.id);
    return `<div class="list-item" onclick="toggleProto('${p.id}')"><div class="check ${done?'done':''}">${done?'✓':''}</div><div style="flex:1"><p style="font-weight:600">${p.nome}</p><p class="muted" style="font-size:13px">${p.desc} · ${p.hora}</p></div></div>`;
  }).join('');
  html+=`</div>`;

  // histórico semanal
  html+=`<div class="card" style="margin-top:14px"><h3 style="font-size:16px;margin-bottom:10px">Adesão da última semana</h3><div style="display:flex;gap:6px">`;
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const key=d.toISOString().slice(0,10); const fez=S.checkins.some(c=>c.date===key); html+=`<div style="flex:1;text-align:center"><div style="height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:${fez?'#fff':'var(--text3)'};background:${fez?'var(--sage)':'var(--navy-soft)'}">${d.getDate()}</div></div>`; }
  html+=`</div><p class="muted" style="font-size:12px;margin-top:8px">Verde = check-in realizado</p></div>`;

  html+=`<div class="card" style="margin-top:14px;background:var(--gold-soft);border-color:#EADFC9"><div style="display:flex;gap:12px;align-items:flex-start"><div style="width:36px;height:36px;border-radius:10px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0">${svgP('star')}</div><div><p style="font-weight:700;color:#9A7B3E">Observações da Dra.</p><p style="font-size:14px;color:#5C4A2E;margin-top:4px">${OBS_DRA}</p></div></div></div>`;

  html+=`<button class="btn btn-outline" style="margin-top:14px" onclick="openNotas()">Ver protocolo completo</button>`;
  $('#trat-content').innerHTML=html;
}
function toggleProto(id){ const key=hojeStr()+'_'+id; const i=S.concluidosHoje.indexOf(key); if(i>=0)S.concluidosHoje.splice(i,1); else S.concluidosHoje.push(key); save(); renderTratamento(); toast('Atualizado'); }

/* ---- PROGRESSO ---- */
function renderProgresso(){
  const f=S.fotos;
  let html=`<div class="before-after" style="margin-bottom:14px">
    <div class="ph">${f[0].url?`<img src="${f[0].url}">`:`<div style="width:100%;height:100%;background:linear-gradient(135deg,#EAF0F6,#F2F4F7);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px">sem foto</div>`}<span>Antes</span></div>
    <div class="ph">${f[f.length-1].url?`<img src="${f[f.length-1].url}">`:`<div style="width:100%;height:100%;background:linear-gradient(135deg,#E7F1ED,#F2F7F4);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px">Dia ${f[f.length-1].label.replace('Dia ','')}</div>`}<span>Atual</span></div>
  </div>`;

  // timeline
  html+=`<div class="card"><h3 style="font-size:16px;margin-bottom:12px">Linha do tempo</h3><div class="timeline">`;
  f.forEach((ph,idx)=>{ const done=!!ph.url; html+=`<div class="tl-item ${done?'':'muted'}"><p style="font-weight:600">${ph.label} <span class="tertiary" style="font-weight:400;font-size:13px">· ${ph.data}</span></p>${done?'<p class="muted" style="font-size:13px">Foto registrada</p>':'<p class="muted" style="font-size:13px">Pendente</p>'}</div>`; });
  html+=`</div></div>`;

  // galeria
  html+=`<div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-size:16px">Galeria</h3><button class="btn btn-ghost btn-sm" onclick="addFoto()">${svgP('plus')} Adicionar</button></div><div class="photo-grid">`;
  if(f.length===0) html+=`<p class="muted" style="grid-column:1/-1;text-align:center;padding:20px">Nenhuma foto ainda.</p>`;
  f.forEach((ph,idx)=>{ html+=`<img src="${ph.url||'https://picsum.photos/seed/empty/200'}" onclick="viewFoto(${idx})" onerror="this.src='https://picsum.photos/seed/empty/200'">`; });
  html+=`</div></div>`;
  $('#prog-content').innerHTML=html;
}

  let html=`<div class="card" style="background:linear-gradient(135deg,var(--navy),#16406E);color:#fff;border:none">
    <p style="font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.05em">Próximo compromisso</p>

      <div style="width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.15);display:flex;flex-direction:column;align-items:center;justify-content:center"><b style="font-size:22px">${fmtData(pr).split(' ')[0]}</b><span style="font-size:12px;opacity:.85">${fmtData(pr).split(' ')[1]}</span></div>

  // próximos retornos
  html+=`<p style="margin:18px 4px 8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text2)">Próximos retornos</p>`;
  let d=new Date(pr);
  for(let i=0;i<3;i++){ const dd=new Date(d); html+=`<div class="appt"><div class="date"><b>${dd.getDate()}</b><span>${fmtData(dd).split(' ')[1]}</span></div><div style="flex:1"><p style="font-weight:600">Retorno presencial</p><p class="muted" style="font-size:13px">15h00 · Dra. Rachel</p></div><div class="chip">${i===0?'próximo':'agendado'}</div></div>`; d.setDate(d.getDate()+15); }

  html+=`<button class="btn btn-ghost" style="margin-top:14px" onclick="openSuporte()">${svgP('chat')} Teleconsulta ou falar com a clínica</button>`;

/* ============ SHEET / MODAL ============ */
function openSheet(t,body){ $('#sheetTitle').textContent=t; $('#sheetBody').innerHTML=body; $('#overlay').classList.add('show'); $('#sheet').classList.add('show'); }
function closeSheet(){ $('#overlay').classList.remove('show'); $('#sheet').classList.remove('show'); }
function openModal(html){ $('#modalBox').innerHTML=html; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); }

/* ---- CHECK-IN FLOW ---- */
function openCheckin(){
  if(S.concluidosHoje.includes(hojeStr())){ toast('Você já fez o check-in de hoje ✓'); return; }
  let body=`<p class="muted" style="margin-bottom:14px">Registre seu progresso de hoje. Tire a foto na mesma posição de sempre — isso ajuda a Dra. a avaliar com precisão.</p>
    <div class="card" style="margin-bottom:14px"><label style="font-size:13px;font-weight:600;color:var(--text2)">Foto de progresso</label>
    <input type="file" id="ckFoto" accept="image/*" capture="environment" style="margin-top:8px;width:100%">
    <div id="ckPreview" style="margin-top:10px"></div></div>
    <p style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px">Aplicação dos produtos</p>
    <div id="ckList">`+PROTOCOLO_HOJE.map(p=>`<div class="list-item" onclick="this.querySelector('.check').classList.toggle('done');this.querySelector('.check').textContent=this.querySelector('.check').classList.contains('done')?'✓':''"><div class="check"></div><div style="flex:1"><p style="font-weight:600">${p.nome}</p><p class="muted" style="font-size:13px">${p.desc}</p></div></div>`).join('')+`</div>
    <button class="btn btn-primary" style="margin-top:18px" onclick="confirmCheckin()">Concluir check-in · +50 pontos</button>`;
  openSheet('Check-in diário', body);
  $('#ckFoto').addEventListener('change',e=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=ev=>{ $('#ckPreview').innerHTML=`<img src="${ev.target.result}" style="width:100%;border-radius:12px">`; }; r.readAsDataURL(f); } });
}
function confirmCheckin(){
  const foto=$('#ckPreview')&&$('#ckPreview').querySelector('img')?$('#ckPreview').querySelector('img').src:null;
  const hoje=hojeStr();
  S.checkins.push({date:hoje, foto:foto, produtos:PROTOCOLO_HOJE.map(p=>p.id)});
  S.concluidosHoje.push(hoje);
  S.streak+=1; S.pontos+=50;
  if(foto){ S.fotos.push({label:'Dia '+(S.fotos.length*15), data:new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), url:foto}); }
  save(); closeSheet(); toast('Check-in registrado! +50 pontos 🎉'); renderInicio();
}

/* ---- LOJA + CARRINHO ---- */
function openLoja(cartOnly){
  const cartHtml = S.carrinho.length? S.carrinho.map((id,i)=>{ const p=PRODUTOS.find(x=>x.id===id); return `<div class="list-item"><img src="${p.img}" style="width:44px;height:44px;border-radius:10px;object-fit:cover"><div style="flex:1"><p style="font-weight:600">${p.nome}</p><p class="muted" style="font-size:13px">R$ ${p.preco.toFixed(2)}</p></div><div class="tertiary" style="cursor:pointer" onclick="rmCart('${id}')">remover</div></div>`; }).join('')+`<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:12px;display:flex;justify-content:space-between;align-items:center"><b>Total: R$ ${S.carrinho.reduce((s,id)=>s+PRODUTOS.find(x=>x.id===id).preco,0).toFixed(2)}</b><button class="btn btn-sage btn-sm" onclick="finalizarCompra()">Finalizar</button></div>` : `<p class="muted" style="text-align:center;padding:20px">Carrinho vazio.</p>`;
  let body=`<div class="seg" style="margin-bottom:14px"><button class="${cartOnly?'':'active'}" onclick="openLoja(false)">Produtos</button><button class="${cartOnly?'active':''}" onclick="openLoja(true)">Carrinho (${S.carrinho.length})</button></div>`;
  if(cartOnly){ body+=`<div class="card" style="padding:8px 14px">${cartHtml}</div>`; }
  else {
    body+=PRODUTOS.map(p=>`<div class="product" style="margin-bottom:12px"><img src="${p.img}" onerror="this.src='https://picsum.photos/seed/x/200'"><div style="flex:1;min-width:0"><p style="font-weight:700">${p.nome}</p><p class="muted" style="font-size:12px">${p.marca}</p><p class="muted" style="font-size:13px;margin:4px 0">${p.desc}</p><div style="display:flex;align-items:center;justify-content:space-between"><b style="color:var(--navy)">R$ ${p.preco.toFixed(2)}</b><button class="btn btn-ghost btn-sm" onclick="addCart('${p.id}')">${svgP('cart')} Add</button></div></div></div>`).join('');
  }
  openSheet(cartOnly?'Carrinho':'Loja · produtos indicados', body);
  updateCartPill();
}
function addCart(id){ if(!S.carrinho.includes(id))S.carrinho.push(id); save(); updateCartPill(); toast('Adicionado à loja'); }
function rmCart(id){ S.carrinho=S.carrinho.filter(x=>x!==id); save(); updateCartPill(); openLoja(true); }
function finalizarCompra(){ S.carrinho=[]; save(); updateCartPill(); closeSheet(); toast('Pedido enviado à clínica ✓'); }
function updateCartPill(){ const p=$('#cartPill'); if(S.carrinho.length){ p.style.display='flex'; p.innerHTML=`${svgP('cart')} ${S.carrinho.length} item(s)`; } else p.style.display='none'; }

/* ---- SUPORTE ---- */
function openSuporte(){ const msg=encodeURIComponent('Olá Dra. Rachel, preciso de suporte sobre meu tratamento.'); openModal(`<h2 style="font-size:20px;margin-bottom:6px">Falar com a clínica</h2><p class="muted" style="margin-bottom:18px">Tire dúvidas, reagende ou peça reposição de produtos.</p><a class="btn btn-sage" href="${WA}${msg}" target="_blank" style="text-decoration:none">${svgP('chat')} Abrir no WhatsApp</a><button class="btn btn-outline" style="margin-top:10px" onclick="closeModal()">Fechar</button>`); }

/* ---- CONQUISTAS ---- */
function openConquistas(){
  const badges=[{i:'trophy',t:'Streak de 12 dias',d:'Mais de 10 dias seguidos',ok:true},{i:'star',t:'Primeira foto',d:'Registrou seu antes',ok:true},{i:'check',t:'Check-in semanal',d:'7 dias de adesão',ok:true},{i:'store',t:'Reposição via app',d:'Fez um pedido',ok:false}];
  let body=`<div style="text-align:center;margin-bottom:16px"><div class="ring" style="--p:75;margin:0 auto"><span>${S.pontos}</span></div><p class="muted" style="margin-top:8px">pontos acumulados</p></div>`;
  body+=badges.map(b=>`<div class="list-item"><div class="qi" style="width:40px;height:40px;border-radius:11px;background:${b.ok?'var(--gold-soft)':'var(--navy-soft)'};color:${b.ok?'#9A7B3E':'var(--text3)'};display:flex;align-items:center;justify-content:center">${svgP(b.i)}</div><div style="flex:1"><p style="font-weight:600">${b.t}</p><p class="muted" style="font-size:13px">${b.d}</p></div>${b.ok?'<span class="chip-gold">✓</span>':'<span class="chip">em breve</span>'}</div>`).join('');
  openSheet('Conquistas', body);
}

/* ---- NOTIFICAÇÕES ---- */
function openNotificacoes(){
  const n=[{t:'Lembrete de aplicação',d:'22h · Minoxidil 5%',time:'há 2h'},{t:'Dra. Rachel enviou uma nota',d:'Mantenha a regularidade das consultas.',time:'ontem'},{t:'Parabéns!',d:'Você completou 12 dias de streak.',time:'há 2 dias'}];
  let body=n.map(x=>`<div class="list-item"><div class="qi" style="width:38px;height:38px;border-radius:11px;background:var(--navy-soft);color:var(--navy);display:flex;align-items:center;justify-content:center">${svgP('bell')}</div><div style="flex:1"><p style="font-weight:600">${x.t}</p><p class="muted" style="font-size:13px">${x.d}</p></div><span class="tertiary" style="font-size:12px">${x.time}</span></div>`).join('');
  openSheet('Notificações', body);
}

/* ---- NOTAS / CONFIG ---- */
function openNotas(){
  let body=`<div class="card" style="background:var(--navy-soft);border:none;margin-bottom:12px"><p style="font-weight:700;color:var(--navy)">Seu protocolo completo</p><p class="muted" style="font-size:13px;margin-top:4px">Prescrito e acompanhado pela Dra. Rachel · ${S.idade} anos</p></div>`;
  body+=PROTOCOLO_HOJE.map(p=>`<div class="list-item"><div class="check done" style="background:var(--sage);border-color:var(--sage);color:#fff">✓</div><div style="flex:1"><p style="font-weight:600">${p.nome}</p><p class="muted" style="font-size:13px">${p.desc} · ${p.hora}</p></div></div>`).join('');
  body+=`<p class="muted" style="font-size:13px;margin-top:12px">Observações: ${OBS_DRA}</p>`;
  openSheet('Protocolo completo', body);
}
function openConfig(){
  let body=`<div class="list-item"><div style="flex:1"><p style="font-weight:600">Nome do paciente</p></div><input id="cfgNome" value="${S.nome}" style="border:1px solid var(--border);border-radius:10px;padding:8px 12px;width:120px;font-family:inherit"></div>
  <button class="btn btn-primary" style="margin-top:16px" onclick="saveNome()">Salvar</button>
  <button class="btn btn-outline" style="margin-top:10px" onclick="resetAll()">Resetar dados demo</button>`;
  openSheet('Configurações', body);
}
function saveNome(){ const v=$('#cfgNome').value.trim(); if(v){ S.nome=v; save(); closeSheet(); renderTopbar(); toast('Nome atualizado'); } }
function resetAll(){ S=JSON.parse(JSON.stringify(DEFAULTS)); save(); closeSheet(); toast('Dados restaurados'); renderInicio(); }

/* ---- FOTOS ---- */
function addFoto(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=e=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=ev=>{ S.fotos.push({label:'Dia '+(S.fotos.length*15+1), data:new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), url:ev.target.result}); save(); closeSheet(); go('progresso'); toast('Foto adicionada'); }; r.readAsDataURL(f); } }; inp.click(); }
function viewFoto(i){ const f=S.fotos[i]; openModal(`<img src="${f.url||'https://picsum.photos/seed/empty/400'}" style="width:100%;border-radius:14px"><p style="text-align:center;margin-top:12px;font-weight:600">${f.label} · ${f.data}</p><button class="btn btn-outline" style="margin-top:14px" onclick="closeModal()">Fechar</button>`); }
function openReagendar(){ openModal(`<h2 style="font-size:20px;margin-bottom:6px">Reagendar retorno</h2><p class="muted" style="margin-bottom:16px">Escolha a melhor data. Mantemos o intervalo de 15 dias.</p><button class="btn btn-sage" onclick="closeModal();toast('Solicitação enviada à clínica ✓')">Solicitar novo horário</button><button class="btn btn-outline" style="margin-top:10px" onclick="closeModal()">Voltar</button>`); }

/* ============ INIT ============ */
function init(){ updateCartPill(); renderTopbar(); renderNav(); renderInicio(); }
init();
</script>
</body>
</html>
