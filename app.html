<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>Beauty Clinic — Seu Tratamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        bg: 'var(--bg)', surface: 'var(--surface)', surface2: 'var(--surface2)',
        text: 'var(--text)', muted: 'var(--muted)', disabled: 'var(--disabled)',
        border: 'var(--border)', primary: 'var(--primary)', cta: 'var(--cta)',
        success: 'var(--success)', warning: 'var(--warning)', danger: 'var(--danger)'
      }, fontFamily: { display: ['Sora','sans-serif'], body: ['Inter','sans-serif'] } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Tema escuro (padrão) — Tricho Dark Science Premium */
    :root {
      --bg:#070D1A; --bg2:#0B1220; --surface:#111B2E; --surface2:#1B2740; --surface3:#22304C;
      --text:#F4F6FA; --muted:#9AA6BC; --disabled:#5B6778; --border:#2A3A55;
      --primary:#2DE0BD; --primary-deep:#129E86; --cta:#F9B859; --cta-2:#FFD28A;
      --live:#F472B6; --violet:#8B5CF6; --success:#4ADE80; --warning:#FBBF24; --danger:#F87171;
    }
    /* Tema claro premium */
    body.light {
      --bg:#F7F1E8; --bg2:#F5F0E8; --surface:#FFFFFF; --surface2:#EFE7D8; --surface3:#E7DCC8;
      --text:#1C1917; --muted:#6B6259; --disabled:#A39B8F; --border:#E4D8C3;
      --primary:#0E9E86; --primary-deep:#0B7A68; --cta:#D97706; --cta-2:#B45309;
      --live:#DB2777; --violet:#7C3AED; --success:#15803D; --warning:#B45309; --danger:#B91C1C;
    }
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;min-height:100vh}
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
      radial-gradient(900px 500px at 85% -10%, rgba(45,224,189,.22), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(244,114,182,.16), transparent 55%),
      radial-gradient(600px 400px at 50% 120%, rgba(139,92,246,.14), transparent 60%)}
    body.light::before{background:
      radial-gradient(900px 500px at 85% -10%, rgba(14,158,134,.14), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(219,39,119,.10), transparent 55%)}
    #app{position:relative;z-index:1}
    .font-display{font-family:'Sora',Georgia,serif}
    .scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
    .nav-item{color:var(--muted)}.nav-item.active{color:var(--primary)}
    .nav-item.active svg{stroke:var(--primary);fill:var(--primary)}
    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border-left:4px solid var(--success);color:var(--text);padding:12px 20px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .toast.show{opacity:1}
    /* Card premium glass */
    .card{background:linear-gradient(180deg,var(--surface),var(--surface) 70%,var(--bg2));backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .18s,box-shadow .18s}
    body.light .card{border-color:var(--border);box-shadow:0 10px 30px rgba(120,90,60,.08)}
    .card:active{transform:translateY(1px) scale(.995)}
    .card-hl{border-left:3px solid var(--primary)}
    .btn-cta{background:linear-gradient(135deg,var(--cta),var(--cta-2));color:#0B1220;font-weight:700;box-shadow:0 6px 18px rgba(249,184,89,.35)}
    body.light .btn-cta{color:#FFFFFF}
    .chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
    .chip-live{background:linear-gradient(135deg,rgba(244,114,182,.2),rgba(139,92,246,.2));color:var(--live)}
    /* FAB WhatsApp */
    .fab{position:fixed;right:16px;bottom:82px;z-index:60;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#25D366,#1EBE5A);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(37,211,102,.5);transition:transform .2s;animation:fab-pulse 2.6s infinite}
    .fab::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(37,211,102,.4);animation:fab-ring 2.6s infinite}
    .fab:active{transform:scale(.9)}
    .fab svg{width:32px;height:32px;fill:#fff}
    @keyframes fab-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes fab-ring{0%{transform:scale(.9);opacity:.8}70%,100%{transform:scale(1.35);opacity:0}}
    /* Bottom nav premium */
    body.light nav{background:rgba(255,255,255,.9)!important;border-color:var(--border)!important}
    body.light header{background:rgba(247,241,232,.9)!important;border-color:var(--border)!important}
    /* Logo wordmark */
    .logo-mono{background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff;border-radius:14px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;font-size:20px;box-shadow:0 6px 16px rgba(139,92,246,.35)}
    .logo-mark{background:linear-gradient(135deg,var(--primary),var(--cta));-webkit-background-clip:text;background-clip:text;color:transparent;font-family:'Sora';font-weight:800}
    /* Header actions */
    .hbtn{width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted)}
    .nav-mid{background:transparent;border:none;color:var(--muted)}
    /* Animations */
    @keyframes slide-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .animate-up{animation:slide-up .35s ease-out both}
     .progress-ring{filter:none}
     /* Clinical hierarchy: action first, secondary discovery later. */
     .animate-up{display:flex;flex-direction:column}
     .animate-up>div:nth-of-type(1){order:5}
     .animate-up>div:nth-of-type(2){order:4}
     .animate-up>div:nth-of-type(3){order:1}
     .animate-up>div:nth-of-type(4){order:2}
     .animate-up>div:nth-of-type(5){order:3}
     .animate-up>div:nth-of-type(6){order:6}
     .animate-up>div:nth-of-type(7){order:7}
     .animate-up>div:nth-of-type(8){order:8}
     .animate-up>div:nth-of-type(9){order:9}
     .card{border-radius:14px;box-shadow:0 8px 24px rgba(3,13,25,.18)}
     .fab{animation:none;box-shadow:0 8px 20px rgba(37,211,102,.28)}
     .quick-action-label{font-size:11px;line-height:1.2}
  </style>
</head>
